            const getURLHost = url => (/^http(s)?:\/\/(.*?)\//).exec(url)[2];

            return new Promise((resolve, reject) => {
                const scriptEl = document.createElement('script');
                scriptEl.type = 'text/javascript';
                scriptEl.onload = function() {
                    resolve(true);
                };
                scriptEl.onerror = function() {
                    reject(e);

                    scriptEl.crossOrigin = 'anonymous';
                }
                scriptEl.src = beaconUrl;
                document.body.appendChild(scriptEl);
            });

        let _beaconAction;

            const KEY = 'JS0JWW5I2RUBJ0'; /* 手图 H5 埋点 appkey */

            const beacon = async (code, data) => {
                if (!window.BeaconAction) {
                    console.warn('Beacon error: BeaconAction is not defined.');

                    return;

                try {
                    if (!_beaconAction) {

                            onReportSuccess: (e) => {

                            onReportFail: (e) => {
                                console.log('[beacon] Report Fail:', e);
                            },
                        });

        /**
         * QQ 浏览器跳转进入
         * 加载 beacon 上报
         */
        if (location.href.includes('MobileQQBrowser_')) {
            _loadBeaconScript().then(() => {
                _beaconWebReport();
            });
        }

        // 新检索列表更新图面区域大小
        const _initListMapHeight = function () {
            try {
                if (!location.href.includes('MobileQQBrowser') || !location.href.includes('poilist=1')) return;
                const listContainerH = $('div.qb-poilist_container')[0].offsetHeight;
                const mapContainer = $('div#common-widget-map')[0];

                const mapBottomHeight = listContainerH * 0.8; // 去除 20% 渐变
                mapContainer.style.bottom = mapBottomHeight + 'px';
            } catch (error) {}
        }
        _initListMapHeight();
    </script>
</html>
